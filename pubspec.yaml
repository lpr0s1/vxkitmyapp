name: idle_nightclub
description: Jeu de gestion de boîte de nuit (Idle Tycoon)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # shared_preferences supprimé : supprime les dépendances natives iOS qui faisaient planter Xcode sans signature

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/app_icon.png 

flutter_launcher_icons:
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true


