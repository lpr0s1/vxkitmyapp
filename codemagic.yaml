workflows:
  ios-unsigned-ipa:
    name: idle_nightclub
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 1. Initialiser l'arborescence iOS
        script: |
          echo "Génération des dossiers natifs iOS..."
          if [ ! -d "ios" ]; then
            flutter create . --project-name idle_nightclub --org com.studio.nightclub --platforms ios
          else
            echo "Dossier iOS déjà présent."
          fi
      - name: 2. Télécharger les dépendances
        script: |
          flutter pub get
      - name: 3. Générer automatiquement l'icône de l'application
        script: |
          if [ -f "assets/app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi
      - name: 4. Compiler la version iOS (Sans signature)
        script: |
          echo "Compilation en cours... (Mode sans signature Apple)"
          flutter build ios --release --no-codesign
      - name: 5. Créer le fichier .ipa
        script: |
          echo "Empaquetage du Payload..."
          mkdir -p build/ios/ipa
          # Gestion dynamique du dossier de sortie iOS selon la version de Flutter
          if [ -d "build/ios/iphoneos" ]; then
            cd build/ios/iphoneos
          else
            cd build/ios/Release-iphoneos
          fi
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -q ../ipa/idle_nightclub.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - test@example.com # Codemagic remplacera par votre email de compte
        notify:
          success: true
          failure: true

